  /* ------------------------------------------------------------------ 小工具 */
  function clamp(v, a, b) {
    if (a === undefined) a = 0;
    if (b === undefined) b = 1;
    return v < a ? a : (v > b ? b : v);
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOutCubic(p) { p = clamp(p); var q = 1 - p; return 1 - q * q * q; }
  function easeInOut(p) { p = clamp(p); return p * p * (3 - 2 * p); }
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  function roundRectPath(g, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function makeCanvas(w, h) {
    var c = document.createElement("canvas");
    c.width = Math.max(1, Math.ceil(w));
    c.height = Math.max(1, Math.ceil(h));

  /* ------------------------------------------------------------------ 布局 */
  var cv = document.getElementById("c");
  var ctx = cv.getContext("2d", { alpha: false });
  var DPR = 1, DW = 1920, DH = 1080, SCALE = 1, PORTRAIT = false, RES = 1;
  var L = {};
  var quality = 1;
  var paperCanvas = null;

  function computeLayout() {
    var vw = Math.max(1, window.innerWidth);
    var vh = Math.max(1, window.innerHeight);
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    PORTRAIT = vh > vw * 1.06;
    DW = PORTRAIT ? 1080 : 1920;
    SCALE = vw / DW;
    DH = vh / SCALE;
    RES = clamp(DPR * SCALE, 1, 2);

    cv.width = Math.round(vw * DPR);
    cv.height = Math.round(vh * DPR);
    cv.style.width = vw + "px";
    cv.style.height = vh + "px";

    if (PORTRAIT) {
      L.title = { size: 190, x: DW * 0.5, y: DH * 0.380 };
      L.sub = { size: 106, x: DW * 0.5, y: DH * 0.516 };
      L.s3 = { x: DW * 0.5, y1: DH * 0.665, y2: DH * 0.755, s1: 64, s2: 58 };
      L.cake = { cx: DW * 0.5, cy: DH * 0.400, s: 1.82, cam: 1250 };
      L.card = { cs: 1.12, minW: 360, h: 150, head: 29, text: 34 };
      L.rain = { prewarm: 26, rate0: 7, rate1: 15, max: 92 };
    } else {
      var k = clamp(DH / 1080, 0.72, 1.22);
      L.title = { size: 286 * k, x: DW * 0.5, y: DH * 0.370 };
      L.sub = { size: 168 * k, x: DW * 0.5, y: DH * 0.704 };
      L.s3 = { x: DW * 0.300, y1: DH * 0.370, y2: DH * 0.537, s1: 80 * k, s2: 72 * k };
      L.cake = { cx: DW * 0.765, cy: DH * 0.545, s: 1.5 * k, cam: 1250 };
      L.card = { cs: 1, minW: 360, h: 150, head: 29, text: 34 };
      L.rain = { prewarm: 20, rate0: 7, rate1: 18, max: 96 };
    }
    L.k = clamp(DH / 1080, 0.72, 1.25);
    window.__info = { dpr: DPR, portrait: PORTRAIT, dw: DW, dh: DH, res: RES };
  }

  function globalQuality() {
    var area = Math.max(1, window.innerWidth * window.innerHeight);
    var q = Math.sqrt(area / 900000);
    q = clamp(q, 0.55, 1);
    if (PORTRAIT) q = Math.min(1, q * 1.1);
    return q;
  }

  /* ------------------------------------------------------------------ 纸张 */
  function buildPaper() {
    var pw = 440;
    var ph = Math.max(160, Math.round(pw * DH / DW));
    var c = makeCanvas(pw, ph);
    var g = c.getContext("2d");
    var rnd = mulberry32(20261110);
    var img = g.createImageData(pw, ph);
    var d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      d[i] = 247; d[i + 1] = 242; d[i + 2] = 230; d[i + 3] = 255;
    }
    var areaFactor = (pw * ph) / (480 * 270);
    var dots = Math.round(15000 * areaFactor);
    for (var n = 0; n < dots; n++) {
      var x = (rnd() * pw) | 0;
      var y = (rnd() * ph) | 0;
      var delta = Math.floor(rnd() * 17) - 9;
      var idx = (y * pw + x) * 4;
      d[idx] = clamp(247 + delta, 0, 255);
      d[idx + 1] = clamp(242 + delta, 0, 255);
      d[idx + 2] = clamp(230 + delta * 0.9, 0, 255);
    }
    g.putImageData(img, 0, 0);

    var fibers = Math.round(1100 * areaFactor);
    for (var f = 0; f < fibers; f++) {
      var x1 = rnd() * pw, y1 = rnd() * ph;
      var ang = (rnd() - 0.5) * 0.5;
      var len = 4 + rnd() * 22;
      g.strokeStyle = rnd() < 0.6 ? "rgba(233,226,210,0.55)" : "rgba(252,248,238,0.65)";
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(x1, y1);
      g.lineTo(x1 + Math.cos(ang) * len, y1 + Math.sin(ang) * len);
      g.stroke();
    }

    var vg = g.createRadialGradient(pw * 0.5, ph * 0.46, Math.min(pw, ph) * 0.30,
                                    pw * 0.5, ph * 0.46, Math.hypot(pw, ph) * 0.62);
    vg.addColorStop(0, "rgba(120,94,66,0)");
    vg.addColorStop(0.55, "rgba(120,94,66,0)");
    vg.addColorStop(1, "rgba(120,94,66,0.30)");
    g.fillStyle = vg;
    g.fillRect(0, 0, pw, ph);

    paperCanvas = c;
  }

  /* ------------------------------------------------------------------ 手写 */
  var handRng = mulberry32(9);

  function Handwriting(opt) {
    this.text = opt.text;
    this.size = opt.size;
    this.color = opt.color || RED;
    this.x = opt.x;
    this.y = opt.y;
    this.start = opt.start;
    this.duration = opt.duration;
    this.angle = opt.angle || 0;
    this.glow = !!opt.glow;
    this.weight = opt.weight || 0;
    this.specks = !!opt.specks;
    this.family = opt.family || "Muyao";

    var meas = makeCanvas(8, 8).getContext("2d");
    var fs = fontString(this.size, this.family);
    meas.font = fs;
    var mt = meas.measureText(this.text);
    var ascent = mt.actualBoundingBoxAscent || this.size * 0.80;
    var descent = mt.actualBoundingBoxDescent || this.size * 0.20;
    var pad = Math.ceil(this.size * 0.10);
    this.w = Math.ceil(mt.width + pad * 2);
    this.h = Math.ceil(ascent + descent + pad * 2);
    this.pad = pad;
    this.baseline = pad + ascent;

    this.res = RES;
    this.base = makeCanvas(this.w * this.res, this.h * this.res);
    this.work = makeCanvas(this.w * this.res, this.h * this.res);
    this.mask = makeCanvas(this.w * this.res, this.h * this.res);

    var b = this.base.getContext("2d");
    b.scale(this.res, this.res);
    b.font = fs;
    b.textBaseline = "alphabetic";
    b.lineJoin = "round";
    if (this.weight > 0) {
      b.strokeStyle = this.color;
      b.lineWidth = this.weight;
      b.strokeText(this.text, pad, this.baseline);
    }
    b.fillStyle = this.color;
    b.fillText(this.text, pad, this.baseline);

    // 每个字的水平范围 / 书写时长 / 毛边系数 / 墨点
    var boxes = [], timings = [], rough = [], specks = [];
    var prev = 0;
    for (var i = 0; i < this.text.length; i++) {
      var nxt = meas.measureText(this.text.slice(0, i + 1)).width;
      var adv = nxt - prev;
      if (adv <= 0.5) adv = Math.max(6, meas.measureText(this.text[i]).width);
      boxes.push({ a: pad + prev, b: pad + prev + adv });
      prev = nxt;
    }
    var total = 0;
    for (i = 0; i < boxes.length; i++) total += Math.max(1, boxes[i].b - boxes[i].a);
    var acc = 0;
    for (i = 0; i < boxes.length; i++) {
      var d0 = this.duration * Math.max(1, boxes[i].b - boxes[i].a) / total;
      timings.push({ a: acc, b: acc + d0 });
      acc += d0;
      var rr = [];
      for (var k = 0; k < 6; k++) rr.push(0.55 + handRng() * 0.45);
      rough.push(rr);
      var sp = [];
      for (k = 0; k < 3; k++) {
        sp.push({
          x: boxes[i].a + handRng() * (boxes[i].b - boxes[i].a),
          y: handRng() * this.h,
          r: 0.8 + handRng() * 1.6
        });
      }
      specks.push(sp);
    }
    this.boxes = boxes;
    this.timings = timings;
    this.rough = rough;
    this.specksArr = specks;
  }

  Handwriting.prototype.progress = function (t) {
    var local = t - this.start;
    var out = [];
    if (local <= 0) {
      for (var i = 0; i < this.timings.length; i++) out.push(0);
      return out;
    }
    for (var j = 0; j < this.timings.length; j++) {
      var tm = this.timings[j];
      out.push(clamp((local - tm.a) / Math.max(0.001, tm.b - tm.a)));
    }
    return out;
  };

  Handwriting.prototype.draw = function (g, t, alpha, dx, dy, shake) {
    alpha = alpha === undefined ? 1 : alpha;
    if (alpha <= 0) return;
    var ps = this.progress(t), any = 0;
    for (var i = 0; i < ps.length; i++) if (ps[i] > any) any = ps[i];
    if (any <= 0) return;

    var W = this.work.width, H = this.work.height;
    var wc = this.work.getContext("2d");
    wc.setTransform(1, 0, 0, 1, 0, 0);
    wc.globalCompositeOperation = "source-over";
    wc.clearRect(0, 0, W, H);
    wc.drawImage(this.base, 0, 0);

    var mc = this.mask.getContext("2d");
    mc.setTransform(1, 0, 0, 1, 0, 0);
    mc.clearRect(0, 0, W, H);
    mc.scale(this.res, this.res);
    mc.fillStyle = "rgba(255,255,255,1)";

    for (i = 0; i < this.boxes.length; i++) {
      var p = ps[i];
      if (p <= 0) continue;
      var a = this.boxes[i].a, b = this.boxes[i].b;
      if (p >= 1) {
        mc.fillRect(a - 1, 0, b - a + 2, this.h);
        continue;
      }
      var edge = a + (b - a) * easeInOut(p);
      var rr = this.rough[i];
      var slices = 6;
      for (var s = 0; s < slices; s++) {
        var y0 = this.h * s / slices;
        var y1 = this.h * (s + 1) / slices + 1;
        var jitter = (rr[s] - 0.5) * 10;
        var ee = Math.max(a, edge + jitter);
        var grad = mc.createLinearGradient(ee - 26, 0, ee, 0);
        grad.addColorStop(0, "rgba(255,255,255,1)");
        grad.addColorStop(0.62, "rgba(255,255,255,0.98)");
        grad.addColorStop(1, "rgba(255,255,255,0)");
        mc.fillStyle = grad;
        mc.fillRect(a - 2, y0, Math.max(0, ee - a + 2), y1 - y0);
      }
    }

    wc.globalCompositeOperation = "destination-in";
    wc.drawImage(this.mask, 0, 0);
    wc.globalCompositeOperation = "source-over";

    g.save();
    g.translate(this.x + (dx || 0), this.y + (dy || 0));
    g.rotate((this.angle + (shake || 0)) * Math.PI / 180);
    g.globalAlpha = alpha;

    if (this.glow) {
      g.shadowColor = "rgba(255,196,118,0.92)";
      g.shadowBlur = 24;
      g.drawImage(this.work, -this.w / 2, -this.h / 2, this.w, this.h);
      g.shadowBlur = 0;
    }
    g.drawImage(this.work, -this.w / 2, -this.h / 2, this.w, this.h);
    g.restore();

    if (this.specks) {
      g.save();
      g.fillStyle = this.color;
      g.globalAlpha = alpha;
      var ox = this.x + (dx || 0) - this.w / 2;
      var oy = this.y + (dy || 0) - this.h / 2;
      for (i = 0; i < this.boxes.length; i++) {
        if (!(ps[i] > 0.02 && ps[i] < 0.99)) continue;
        var edge2 = this.boxes[i].a + (this.boxes[i].b - this.boxes[i].a) * easeInOut(ps[i]);
        var arr = this.specksArr[i];
        for (var q = 0; q < arr.length; q++) {
          if (arr[q].x > edge2) continue;
          g.beginPath();
          g.arc(ox + arr[q].x, oy + arr[q].y, arr[q].r, 0, Math.PI * 2);
          g.fill();
        }
      }
      g.restore();
    }
  };

  /* ------------------------------------------------------------------ 卡片 */
  function cardMetrics() {
    var cs = L.card.cs;
    return {
      cs: cs,
      w: L.card.minW * cs,
      h: L.card.h * cs,
      head: L.card.head * cs,
      text: L.card.text * cs,
      pad: 18 * cs
    };
  }

  function makeCard(wish) {
    var m = cardMetrics();
    var meas = makeCanvas(8, 8).getContext("2d");
    meas.font = fontString(m.text, "Muyao");
    var tw = meas.measureText(wish).width;
    var w = Math.max(m.w, tw + 64 * m.cs);
    var h = m.h;
    var pad = m.pad;
    var c = makeCanvas(w + pad * 2, h + pad * 2 + 14);
    var g = c.getContext("2d");

    g.save();
    g.shadowColor = "rgba(90,60,50,0.20)";
    g.shadowBlur = 11;
    g.shadowOffsetY = 7;
    g.fillStyle = "#fffdf8";
    roundRectPath(g, pad, pad, w, h, 20 * m.cs);
    g.fill();
    g.restore();

    g.strokeStyle = "#f3e2dc";
    g.lineWidth = 2 * m.cs;
    roundRectPath(g, pad, pad, w, h, 20 * m.cs);
    g.stroke();

    g.font = fontString(m.head, "Muyao");
    g.textBaseline = "top";
    g.fillStyle = ROSE;
    g.fillText("◎ 生日快乐", pad + 24 * m.cs, pad + 20 * m.cs);

    g.strokeStyle = "#f5dedc";
    g.lineWidth = 2 * m.cs;
    g.beginPath();
    g.moveTo(pad + 24 * m.cs, pad + 62 * m.cs);
    g.lineTo(pad + 88 * m.cs, pad + 62 * m.cs);
    g.stroke();

    g.font = fontString(m.text, "Muyao");
    g.fillStyle = INK;
    g.fillText(wish, pad + 24 * m.cs, pad + 82 * m.cs);

    return { canvas: c, w: c.width, h: c.height };
  }

  function CardRain() {
    this.cards = [];
    this.cache = {};
    this.buildCache();
    this.reset();
  }
  CardRain.prototype.buildCache = function () {
    this.cache = {};
    for (var i = 0; i < WISHES.length; i++) this.cache[WISHES[i]] = makeCard(WISHES[i]);
  };
  CardRain.prototype.reset = function () {
    this.cards = [];
    this.rnd = mulberry32(88);
    this.acc = 0;
    this.burst = false;
  };
  CardRain.prototype.spawn = function (prewarm) {
    if (this.cards.length >= L.rain.max) return;
    var wish = WISHES[(this.rnd() * WISHES.length) | 0];
    var surf = this.cache[wish];
    var scale = 0.52 + this.rnd() * 0.43;
    var x, y, target;
    if (prewarm) {
      x = 40 + this.rnd() * (DW - 80);
      y = 20 + this.rnd() * (DH - 120);
      target = y;
    } else {
      x = -60 + this.rnd() * (DW + 120);
      y = -300 + this.rnd() * (DH * 0.55 + 300);
      target = clamp(y + 120 + this.rnd() * 300, DH * 0.12, DH - 40);
    }
    this.cards.push({
      surf: surf,
      x: x, y: y,
      scale: scale,
      phase: this.rnd() * 6.283,
      target: target,
      speed: (120 + this.rnd() * 120) * (DH / 1080),
      alpha: prewarm ? 1 : 0,
      tilt: -7 + this.rnd() * 14
    });
  };
  CardRain.prototype.update = function (t, dt) {
    if (!this.burst && t >= TL.cards.start) {
      for (var i = 0; i < L.rain.prewarm; i++) this.spawn(true);
      this.burst = true;
    }
    if (t >= TL.cards.start && t <= TL.cards.end) {
      var rate = lerp(L.rain.rate0, L.rain.rate1, clamp((t - TL.cards.start) / 4));
      this.acc += rate * dt;
      while (this.acc >= 1) { this.acc -= 1; this.spawn(false); }
    }
    for (i = 0; i < this.cards.length; i++) {
      var c = this.cards[i];
      if (c.y < c.target) c.y = Math.min(c.target, c.y + c.speed * dt);
      c.x += Math.sin(t * 0.6 + c.phase) * 6 * dt;
      c.alpha = clamp(c.alpha + dt * 2.2);
    }
  };
  CardRain.prototype.draw = function (g, t) {
    if (t < TL.cards.start - 0.1) return;
    var fade = clamp((t - (TL.cards.start - 0.1)) / 0.6);
    var mul = t < TL.cards.dim ? 1 : lerp(1, 0.26, clamp((t - TL.cards.dim) / TL.cards.dimDur));
    var order = this.cards.slice().sort(function (a, b) { return a.scale - b.scale; });
    for (var i = 0; i < order.length; i++) {
      var c = order[i];
      var a = c.alpha * fade * mul;
      if (a <= 0.01) continue;
      var yaw = Math.sin(t * 0.45 + c.phase) * 0.55 + (c.phase % 0.4);
      var rot = c.tilt + Math.sin(t * 0.5 + c.phase) * 4.5 + yaw * 5;
      var sx = c.scale * (0.84 + 0.16 * Math.cos(yaw));
      g.save();
      g.translate(c.x, c.y);
      g.rotate(rot * Math.PI / 180);
      g.scale(sx, c.scale);
      g.globalAlpha = a;
      g.drawImage(c.surf.canvas, -c.surf.w / 2, -c.surf.h / 2);
      g.restore();
    }
  };

  /* ------------------------------------------------------------------ 蛋糕 */
  var CREAM_C = [255, 240, 212];
  var CREAM2 = [255, 250, 236];
  var PINK_C = [255, 190, 204];
  var PINK2 = [255, 216, 222];
  var GOLD_P = [255, 206, 136];
  var WHITE_P = [255, 253, 244];

  function rgbStr(c) { return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; }
  function dimOf(c) {
    var m = c.match(/\d+/g);
    return "rgb(" + ((m[0] * 0.62) | 0) + "," + ((m[1] * 0.62) | 0) + "," + ((m[2] * 0.62) | 0) + ")";
  }

  function Cake() {
    this.points = [];
    this.sprites = {};
    this.start = TL.s3.cake;
    this.cam = 1250;
    this.build(quality);
    this.sparkles = [];
    var rnd = mulberry32(4242);
    for (var i = 0; i < 96; i++) {
      this.sparkles.push({
        a: rnd() * Math.PI * 2,
        rad: 215 + rnd() * 185,
        speed: 24 + rnd() * 38,
        phase: rnd() * 520,
        col: i % 3 ? "rgb(255,240,200)" : rgbStr(PINK_C),
        r: i % 4 ? 2 : 3
      });
    }
  }
  Cake.prototype.build = function (q) {
    var self = this;
    var rnd = mulberry32(20261110);
    var pts = [];
    function add(x, y, z, col, size) {
      pts.push({
        x: x, y: y, z: z, col: col, dim: dimOf(col), size: size,
        sx: x * 3.2 + (rnd() - 0.5) * 560,
        sy: y * 2.2 + (rnd() - 0.5) * 540,
        sz: z * 3.2 + (rnd() - 0.5) * 560,
        delay: rnd() * 0.6
      });
    }
    var i, n;
    n = Math.max(30, Math.round(80 * q));
    for (i = 0; i < n; i++) {
      var th = rnd() * Math.PI * 2;
      var rr = 184 * Math.sqrt(rnd());
      add(rr * Math.cos(th), -216, rr * Math.sin(th), rgbStr(GOLD_P), 0.5);
    }
    var layers = [
      [-206, 150, 78, CREAM_C, GOLD_P],
      [-132, 114, 72, PINK_C, PINK2],
      [-62, 78, 68, CREAM2, WHITE_P]
    ];
    for (var li = 0; li < layers.length; li++) {
      var yb = layers[li][0], R = layers[li][1], hh = layers[li][2];
      var baseC = layers[li][3], accentC = layers[li][4];
      n = Math.max(40, Math.round(380 * q));
      for (i = 0; i < n; i++) {
        var th2 = rnd() * Math.PI * 2;
        var yy = yb + hh * rnd();
        var ripple = 5 * Math.sin(13 * th2 + yy * 0.12) + 2 * Math.sin(27 * th2 - 0.7);
        var r2 = R + ripple;
        var cc = baseC;
        if (yy < yb + 5) cc = [baseC[0] * 0.72 | 0, baseC[1] * 0.72 | 0, baseC[2] * 0.72 | 0];
        else if (yy > yb + hh - 6) cc = accentC;
        else if (rnd() < 0.25) cc = accentC;
        add(r2 * Math.cos(th2), yy, r2 * Math.sin(th2), rgbStr(cc), [0.7, 0.85, 1][(rnd() * 3) | 0]);
      }
      n = Math.max(14, Math.round(125 * q));
      for (i = 0; i < n; i++) {
        var th3 = rnd() * Math.PI * 2;
        var rr3 = (R - 6) * Math.sqrt(rnd());
        add(rr3 * Math.cos(th3), yb + hh + 1.5, rr3 * Math.sin(th3), rgbStr(WHITE_P), rnd() < 0.5 ? 0.6 : 0.8);
      }
      n = Math.max(8, Math.round(72 * q));
      for (i = 0; i < n; i++) {
        var th4 = rnd() * Math.PI * 2;
        var r4 = R + 2 + 2 * Math.sin(14 * th4);
        add(r4 * Math.cos(th4), yb + hh, r4 * Math.sin(th4), rgbStr(WHITE_P), 1);
      }
    }
    n = Math.max(12, Math.round(95 * q));
    for (i = 0; i < n; i++) {
      var th5 = rnd() * Math.PI * 2;
      var yy5 = -2 + rnd() * 64;
      var r5 = 8 + (rnd() - 0.5) * 2;
      add(r5 * Math.cos(th5), yy5, r5 * Math.sin(th5),
          ((yy5 / 9) | 0) % 2 === 0 ? rgbStr(PINK_C) : rgbStr(WHITE_P), 0.7);
    }
    n = Math.max(8, Math.round(42 * q));
    for (i = 0; i < n; i++) {
      var th6 = rnd() * Math.PI * 2;
      var rr6 = 14 + rnd() * 56;
      add(rr6 * Math.cos(th6), -4 + (rnd() - 0.5) * 2, rr6 * Math.sin(th6),
          rgbStr([PINK_C, GOLD_P, WHITE_P][(rnd() * 3) | 0]), 0.7);
    }
    this.points = pts;
  };
  Cake.prototype.setQuality = function (q) {
    if (Math.abs(q - this.q) < 0.02) return;
    this.q = q;
    this.build(q);
  };
  Cake.prototype.sprite = function (col, rad) {
    var key = col + "|" + rad;
    if (this.sprites[key]) return this.sprites[key];
    var size = rad * 2 + 2;
    var c = makeCanvas(size, size);
    var g = c.getContext("2d");
    var cx = size / 2, cy = size / 2;
    var gr = g.createRadialGradient(cx, cy, 0, cx, cy, rad);
    var m = col.match(/\d+/g);
    gr.addColorStop(0, "rgba(" + m[0] + "," + m[1] + "," + m[2] + ",1)");
    gr.addColorStop(0.45, "rgba(" + m[0] + "," + m[1] + "," + m[2] + ",0.85)");
    gr.addColorStop(1, "rgba(" + m[0] + "," + m[1] + "," + m[2] + ",0)");
    g.fillStyle = gr;
    g.fillRect(0, 0, size, size);
    this.sprites[key] = c;
    return c;
  };

  Cake.prototype.draw = function (g, t) {
    if (t < this.start) return;
    var C = L.cake;
    var asm = clamp((t - this.start) / 1.9);
    var settled = asm >= 1;
    var ang = 0.6 + (t - this.start) * 0.42;
    var ca = Math.cos(ang), sa = Math.sin(ang);
    var cx = C.cx, cy = C.cy, sc = C.s, cam = C.cam;

    // 暖色环境光
    g.save();
    g.globalCompositeOperation = "lighter";
    var amb = g.createRadialGradient(cx, cy - 16, 10, cx, cy - 16, 300 * sc / 1.5);
    amb.addColorStop(0, "rgba(255,176,96,0.16)");
    amb.addColorStop(0.55, "rgba(255,150,80,0.06)");
    amb.addColorStop(1, "rgba(255,150,80,0)");
    g.fillStyle = amb;
    g.fillRect(cx - 340 * sc / 1.5, cy - 360 * sc / 1.5, 680 * sc / 1.5, 680 * sc / 1.5);
    g.restore();

    var pts = this.points;
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      var px, py, pz;
      if (settled) {
        px = p.x; py = p.y; pz = p.z;
      } else {
        var a = (asm - p.delay) / 0.5;
        if (a <= 0) continue;
        if (a > 1) a = 1;
        var e = easeOutCubic(a);
        px = p.sx + (p.x - p.sx) * e;
        py = p.sy + (p.y - p.sy) * e;
        pz = p.sz + (p.z - p.sz) * e;
      }
      var xr = px * ca - pz * sa;
      var zr = px * sa + pz * ca;
      var f = cam / (cam + zr);
      if (f <= 0.25) continue;
      var spx = cx + xr * sc * f;
      var spy = cy - py * sc * f;
      if (spx < -30 || spx > DW + 30 || spy < -30 || spy > DH + 30) continue;
      var rad = Math.round(4.4 * p.size * f);
      if (rad < 2) rad = 2; else if (rad > 5) rad = 5;
      var spr = this.sprite(zr < 0 ? p.col : p.dim, rad);
      g.drawImage(spr, spx - rad, spy - rad, rad * 2, rad * 2);
    }

    this.flame(g, t, cx, cy - 64 * sc);
    this.sparkle(g, t, cx, cy);
  };

  Cake.prototype.flame = function (g, t, fx, fy) {
    var sp = L.cake.s / 1.5;
    var pulse = 1 + 0.09 * Math.sin(t * 12) + 0.05 * Math.sin(t * 21 + 1.3);
    var h = 34 * sp * pulse, w = 8.5 * sp * pulse;
    g.save();
    g.globalCompositeOperation = "lighter";

    var halo = g.createRadialGradient(fx, fy - h * 0.4, 0, fx, fy - h * 0.4, 44 * sp);
    halo.addColorStop(0, "rgba(255,170,60,0.55)");
    halo.addColorStop(0.5, "rgba(255,120,30,0.18)");
    halo.addColorStop(1, "rgba(255,120,30,0)");
    g.fillStyle = halo;
    g.fillRect(fx - 50 * sp, fy - 50 * sp, 100 * sp, 100 * sp);

    function drop(scale, fill) {
      var hh = h * scale, ww = w * scale;
      g.beginPath();
      g.moveTo(fx, fy - hh);
      g.bezierCurveTo(fx + ww * 0.95, fy - hh * 0.42, fx + ww * 0.62, fy, fx, fy);
      g.bezierCurveTo(fx - ww * 0.62, fy, fx - ww * 0.95, fy - hh * 0.42, fx, fy - hh);
      g.fillStyle = fill;
      g.fill();
    }
    drop(1.0, "rgba(255,120,30,0.55)");
    drop(0.74, "rgba(255,190,70,0.80)");
    drop(0.40, "rgba(255,248,210,0.95)");
    g.restore();
  };

  Cake.prototype.sparkle = function (g, t, cx, cy) {
    var s = L.cake.s / 1.5;
    g.save();
    g.globalCompositeOperation = "lighter";
    for (var i = 0; i < this.sparkles.length; i++) {
      var sp = this.sparkles[i];
      var y = -250 + ((sp.phase + (t - this.start) * sp.speed) % 540);
      var fade = Math.sin(clamp((y + 250) / 540) * Math.PI);
      if (fade <= 0.05) continue;
      var sway = Math.sin(t * 0.8 + i) * 12;
      var x = cx + Math.cos(sp.a + (t - this.start) * 0.12) * sp.rad * s + sway * s;
      var sy = cy - y * s;
      var r = sp.r * (0.8 + 0.4 * s);
      var spr = this.sprite(sp.col, Math.max(2, Math.round(r)));
      g.globalAlpha = fade * 0.8;
      g.drawImage(spr, x - r, sy - r, r * 2, r * 2);
    }
    g.restore();
    g.globalAlpha = 1;
  };

  /* ------------------------------------------------------------------ 场景 */
  var title, sub, line1, line2, rain, cake;
  var t = 0, last = 0, freeze = false, fixedT = null;
  var tBase = 0, t0 = 0;
  var gq = mulberry32(9);
  var paperSpecks = [];

  function buildScene() {
    buildPaper();
    title = new Handwriting({
      text: "生日快乐", size: L.title.size, color: RED, x: L.title.x, y: L.title.y,
      start: TL.s1.title, duration: TL.s1.titleDur, angle: -1.4,
      weight: L.title.size * 0.016, specks: true
    });
    sub = new Handwriting({
      text: "Happy Birthday", size: L.sub.size, color: PINK, x: L.sub.x, y: L.sub.y,
      start: TL.s1.sub, duration: TL.s1.subDur, angle: -2.2, family: "Vibes"
    });
    line1 = new Handwriting({
      text: "亲爱的杨子萱", size: L.s3.s1, color: CREAM, x: L.s3.x, y: L.s3.y1,
      start: TL.s3.line1, duration: TL.s3.line1Dur, glow: true
    });
    line2 = new Handwriting({
      text: "祝你生日快乐～0v0", size: L.s3.s2, color: CREAM, x: L.s3.x, y: L.s3.y2,
      start: TL.s3.line2, duration: TL.s3.line2Dur, glow: true
    });

    rain = new CardRain();
    cake = new Cake();
    cake.q = quality;
    gq = mulberry32(9);
    paperSpecks = [];
    for (var i = 0; i < 46; i++) {
      paperSpecks.push({
        x: DW * (0.146 + 0.719 * gq()),
        y: DH * (0.213 + 0.306 * gq()),
        r: 0.7 + gq() * 1.9,
        a: 25 + gq() * 85,
        th: gq()
      });
    }
  }

  function render(tt) {
    ctx.setTransform(DPR * SCALE, 0, 0, DPR * SCALE, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, DW, DH);

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    if (paperCanvas) ctx.drawImage(paperCanvas, 0, 0, DW, DH);

    // 第一幕
    if (tt < TL.s1.fade + TL.s1.fadeDur) {
      var al = tt < TL.s1.fade ? 1 : 1 - clamp((tt - TL.s1.fade) / TL.s1.fadeDur);
      var dx = Math.sin(tt * 1.9) * 3.5 + Math.sin(tt * 0.77 + 1.3) * 2.2;
      var dy = Math.cos(tt * 1.5) * 2.8 + Math.sin(tt * 0.61) * 1.8;
      var shake = Math.sin(tt * 0.8) * 0.22;
      var p = clamp((tt - 0.8) / 2.5);
      ctx.save();
      ctx.fillStyle = RED;
      for (var i = 0; i < paperSpecks.length; i++) {
        var sp = paperSpecks[i];
        var q = clamp((p - sp.th) * 4);
        if (q <= 0) continue;
        ctx.globalAlpha = (sp.a / 255) * q * al;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      title.draw(ctx, tt, al, dx, dy, shake);
      sub.draw(ctx, tt, al, dx * 0.8, dy * 0.8, shake * 0.7);
    }

    // 第二幕
    rain.draw(ctx, tt);

    // 第三幕：压暗背景 + 粒子蛋糕 + 手写
    if (tt >= TL.s3.start) {
      var pk = clamp((tt - TL.s3.start) / TL.s3.fadeDur);
      var k = lerp(255, 65, pk);
      ctx.save();
      ctx.globalCompositeOperation = "multiply";
      ctx.fillStyle = "rgb(" + (k | 0) + "," + ((k * 0.93) | 0) + "," + ((k * 0.88) | 0) + ")";
      ctx.fillRect(0, 0, DW, DH);
      ctx.restore();
      cake.draw(ctx, tt);
      line1.draw(ctx, tt, 1, 0, 0, 0);
      line2.draw(ctx, tt, 1, 0, 0, 0);
    }
  }

  /* ------------------------------------------------------------------ 时间轴 / 交互 */
  function seek(target) {
    target = Math.max(0, target);
    rain.reset();
    var u = 0, dt = 1 / 40;
    while (u < target - 1e-6) {
      var step = Math.min(dt, target - u);
      u += step;
      rain.update(u, step);
    }
    t = target;
    tBase = target;
    t0 = performance.now();
    last = 0;
  }

  function skip() {
    if (freeze) freeze = false;
    if (t < TL.cards.start - 0.05) {
      seek(TL.cards.start + 0.02);
    } else if (t < TL.s3.start - 0.05) {
      seek(TL.s3.start + 0.02);
    } else {
      seek(0);
    }
  }

  var fsAsked = false;
  function onTap(e) {
    if (e && e.cancelable) e.preventDefault();
    if (!fsAsked && window.matchMedia && window.matchMedia("(pointer: coarse)").matches) {
      fsAsked = true;
      if (document.documentElement.requestFullscreen && document.fullscreenEnabled) {
        try {
          var pr = document.documentElement.requestFullscreen();
          if (pr && typeof pr.catch === "function") pr.catch(function () {});
        } catch (err) {}
      }
    }
    skip();
  }

  function onKey(e) {
    if (e.key === "Escape") return;
    if (e.key === " " || e.key === "Spacebar" || e.key === "Enter" ||
        e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === "PageDown") {
      e.preventDefault();
      skip();
    }
  }

  /* ------------------------------------------------------------------ 主循环 */
  var adaptAcc = 0, adaptN = 0, adaptCooldown = 0;

  function adapt(dt) {
    adaptAcc += dt;
    adaptN++;
    if (adaptAcc < 2.0) return;
    var avg = adaptAcc / adaptN;
    adaptAcc = 0; adaptN = 0;
    if (t < 10) return;
    if (avg > 1 / 30 && quality > 0.45 && adaptCooldown <= 0) {
      quality = Math.max(0.45, quality * 0.8);
      cake.setQuality(quality);
      adaptCooldown = 6;
    }
    if (adaptCooldown > 0) adaptCooldown -= 2;
  }

  function loop(now) {
    requestAnimationFrame(loop);
    if (!t0) { t0 = now; tBase = t; }
    if (!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (freeze) { render(t); return; }
    if (dt > 0.2) dt = 0.2;
    if (dt < 0) dt = 0;
    t = tBase + (now - t0) / 1000;
    rain.update(t, dt);
    adapt(dt);
    render(t);
  }

  function boot() {
    var p = new URLSearchParams(location.search);
    if (p.has("t")) {
      var v = parseFloat(p.get("t"));
      if (isFinite(v)) fixedT = Math.max(0, v);
    }
    freeze = p.has("freeze");

    var loads = [];
    try {
      loads.push(document.fonts.load('100px "Muyao"'));
      loads.push(document.fonts.load('100px "Vibes"'));
    } catch (e) {}
    Promise.all(loads).catch(function () {}).then(function () {
      computeLayout();
      quality = globalQuality();
      buildScene();
      if (fixedT !== null) {
        seek(fixedT);
        t = fixedT;
      }
      render(t);
      window.__ready = true;
      requestAnimationFrame(loop);
    });
  }

  window.__seek = function (v) { seek(v); render(t); };
  window.__skip = skip;
  window.__stats = function () {
    return { t: t, points: cake ? cake.points.length : 0, quality: quality, cards: rain ? rain.cards.length : 0 };
  };

  window.addEventListener("resize", function () {
    clearTimeout(window.__rt);
    window.__rt = setTimeout(function () {
      var old = t;
      computeLayout();
      quality = globalQuality();
      freeze = true;
      buildScene();
      seek(old);
      freeze = false;
      last = 0;
    }, 180);
  });
  window.addEventListener("orientationchange", function () {
    setTimeout(function () { window.dispatchEvent(new Event("resize")); }, 260);
  });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) {
      tBase = t;
      t0 = performance.now();
      last = 0;
    }
  });

  cv.addEventListener("pointerdown", onTap, { passive: false });
  cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("keydown", onKey);
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  boot();
})();
</script>
</body>
</html>
